# En-têtes de sécurité, inclus dans chaque bloc qui ajoute ses propres en-têtes
# (nginx n'hérite pas des add_header du serveur dès qu'un location en définit).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Caméra, micro et partage d'écran : pour le site lui-même seulement (appels de la messagerie, 13/11/2026).
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
# Politique complète en observation (07/11/2026) : rapports dans Pilotage › /logs (« Politique CSP »), puis bloquante.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://www.googletagservices.com https://adservice.google.com https://www.google.com https://static.cloudflareinsights.com; connect-src 'self' https://api.fidni.fr wss://api.fidni.fr https://accounts.google.com https://*.google.com https://*.googlesyndication.com https://*.doubleclick.net https://cloudflareinsights.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' data:; frame-src https://accounts.google.com https://*.doubleclick.net https://*.googlesyndication.com https://www.google.com https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; media-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri https://api.fidni.fr/api/logs/csp/" always;
