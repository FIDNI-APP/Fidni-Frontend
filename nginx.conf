server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Mêmes en-têtes que le serveur Vite (vite.config.ts, server.headers).
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Fichiers générés par Vite : nom haché, donc cache permanent.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Page de l'application : jamais mise en cache, pour qu'une mise en ligne soit visible tout de suite.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Fichiers de public/ (icônes, ads.txt, robots.txt, images du campus) : nom fixe, cache court.
    location ~* \.(ico|png|jpe?g|webp|svg|txt|xml|webmanifest)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Exercices, leçons, examens : page pré-remplie par le backend (titre, description, énoncé) pour
    # les moteurs de recherche (backend/src/config/seo.py). Si le backend ne répond pas, on sert
    # l'index.html normal : le site fonctionne toujours. Le nom « backend » est résolu à la demande
    # (DNS interne de Docker) pour que nginx démarre même hors du docker-compose du serveur.
    location ~ ^/(?<seo_section>exercises|lessons|exams)/(?<seo_id>[0-9]+)/?$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $seo_backend http://backend:80;
        proxy_pass $seo_backend/seo/$seo_section/$seo_id/;
        proxy_set_header Host api.fidni.fr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
        include /etc/nginx/security-headers.conf;
    }

    # Accueil et listes : même principe (titre, description, liens vers chaque contenu par niveau et
    # chapitre). Les filtres (?classLevels=…) restent gérés par l'application.
    location = / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $seo_backend http://backend:80;
        proxy_pass $seo_backend/seo/page/home/;
        proxy_set_header Host api.fidni.fr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
        include /etc/nginx/security-headers.conf;
    }
    location ~ ^/(?<seo_list>exercises|lessons|exams)/?$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $seo_backend http://backend:80;
        proxy_pass $seo_backend/seo/page/$seo_list/;
        proxy_set_header Host api.fidni.fr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
        include /etc/nginx/security-headers.conf;
    }

    # Pages par niveau et par chapitre : /exercises/niveau/2eme-bac-sm[/limites-et-continuite].
    location ~ ^/(?<seo_hub>exercises|lessons|exams)/niveau/(?<seo_level>[a-z0-9-]+)(?:/(?<seo_chapter>[a-z0-9-]+))?/?$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $seo_backend http://backend:80;
        set $seo_hub_path $seo_level;
        if ($seo_chapter != "") { set $seo_hub_path $seo_level/$seo_chapter; }
        proxy_pass $seo_backend/seo/hub/$seo_hub/$seo_hub_path/;
        proxy_set_header Host api.fidni.fr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
        include /etc/nginx/security-headers.conf;
    }

    # Plan du site aussi sur fidni.fr (celui de l'API reste valable).
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $seo_backend http://backend:80;
        proxy_pass $seo_backend/sitemap.xml;
        proxy_set_header Host api.fidni.fr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location @spa {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Routes de l'application (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
